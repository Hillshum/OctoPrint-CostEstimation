###
### Simple script to build a zip file of the whole repository
###

name: Build Plugin Action
on: [push]
jobs:
  build:
    name: 🏗 Build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏗 Install build dependencies
        run: python -m pip install build wheel octoprint --user

      - name: "Build wheel"
        run: python -m build . --outdir dist
      
      - name: "Set WHEEL_FILE"
        run: echo "WHEEL_FILE=$(ls dist/*.whl)" >> $GITHUB_ENV

      - name: ⬆ Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: "build"
          path: ${{ env.WHEEL_FILE }}

  test-install:
    name: 🧪 Installation tests
    needs: build
    strategy:
      matrix:
        python: ["3.7", "3.8"]
    runs-on: ubuntu-22.04
    steps:
      - name: 🏗 Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ⬇ Download build result
        uses: actions/download-artifact@v4
        with:
          name: build
          path: dist
      - run: ls -l dist
      - name: 🏗 Install dependencies
        run: |
          python -m pip install --upgrade wheel setuptools pip
          python -m pip install octoprint
      - name: 🧪 Test install of package
        run: |
          python -m pip install dist/octoprint_costestimation-*.whl
